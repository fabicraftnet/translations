items:
  disabled:
    name: <red>
    lore:
    - <red>  Function is disabled
    - <red>
  lobby:
    games:
      name: <green>Kaikki maailmat
      lore:
      - <gray>Valitse maailma ja käy piipahtamassa
    own:
      name: <aqua>Omat maailmat
      lore:
      - <gray>Luomasi maailmat löydät täältä
      - <gray>Jos ei maailmaa löydy on aika tehdä sellainen!
    changelogs:
      name: <light_purple>Päivitykset
      lore:
      - ''
      - <gray>Lue uusimmat juorut pluginin päivityksistä
      pages:
      - ''
  developer:
    turned-on: '<green> ● '
    turned-off: '<gray> ○ '
    coding-book:
      name: <aqua>Tervetuloa koodaamaan
      lore:
      - <gray>This book will teach you
      - <gray>the basic concepts of coding.
      pages:
      - "<blue> You are in the coding world!<reset>\n \nHere you will create code\
        \ for your world using <dark_aqua>b<gray>l<gold>o<blue>c<red><reset>ks in\
        \ the inventory.\n \nThis book will help you learn the basics of coding, <red>turn\
        \ the page to continue..."
      - "<dark_aqua>⚂ Get to know the blocks!<reset>\n \nPlace <dark_aqua>event<black>\
        \ blocks on <blue>blue glass<black> to trigger <gray>actions<black> and <gold>conditions<black>,\
        \ which you place on <dark_gray>gray<black> glass."
      - "<dark_aqua>⚂ Get to know the blocks!<reset>\n \n<bold>What are events?!<reset>\n\
        \ \n<dark_aqua>Player events<reset> happen when a player performs an action\
        \ in the world, and then in the code, we execute actions and conditions on\
        \ the player."
      - "<dark_aqua>⚂ Get to know the blocks!<reset>\n \n<bold>What are actions?<reset>\n\
        \ \n<gray>Actions<reset> allow you to control the player: give items, teleport,\
        \ or kick them from the world. And that's not all!"
      - "<dark_aqua>⚂ Get to know the blocks!<reset>\n \n<bold>How do conditions work?<reset>\n\
        \ \n<reset>If a <gold>condition<reset> is met, the code inside the pistons\
        \ will also execute! Check the player's name, item, block, or status."
      - "<dark_green> Values for actions!<reset>\n \nSome actions place a chest where\
        \ you will put values.\n \nThey can be <green>numbers<reset>, <gold>text<gray>,\
        \ <gray>locations<reset>, or even <red>items<reset>!"
      - "<gold>🪣 Variables<reset>\n \n<bold>A variable<reset><reset> is a storage\
        \ unit that holds a value.\n \nYou can set any value in it and later use that\
        \ value in an action!"
      - "<gold>🪣 Variables<reset>\n \n<bold>A list<reset><reset> can store multiple\
        \ values.\n \nYou can sort, add new values, retrieve, or delete them."
      - "<gold>🪣 Variables<reset>\n \n<bold>Dictionaries<reset><reset> store values\
        \ by <bold>keys<reset><reset>!\n \nEach key has a value. You can add keys\
        \ with values or retrieve values by key. It's very convenient!"
      - "<dark_red>🧰 Modules<reset>\n \n<black>You can install prepared code by players<reset>!\n\
        \ \nTo install a module, type /modules and choose module, that's useful for\
        \ you. Or create own with manipulator. "
    lines-controller:
      name: <red>Manipulator <green>[← LMB] [RMB →] [F]
      lore:
      - <gray>Allows you to move action and
      - <gray>conditions block to left or right.
      - <green>Perfect for adding more actions!
      - ''
      - <gray>Also selects event blocks and allows
      - <gray>you to <green>create modules<gray> or duplicate
      - <gray>blocks by pressing <yellow>F<gray>.
      - ''
      - '<white>In hand:'
      - '<yellow> Right-click:'
      - <gray>  Move action blocks to the right
      - '<yellow> Left-click:'
      - <gray>  Move action blocks to the left
      - '<yellow> F:'
      - <gray>  Opens coding lines menu
    arrow-not:
      name: <red>NOT Arrow <green>[Right-click]
      lore:
      - <gray>Reverses the behavior of conditions
      - <gray>literally to the opposite!
      - ''
      - <gray>When a condition <red>does not meet
      - <gray>the requirements, and it has
      - <gray>a <red>NOT<gray>, the code inside
      - <gray>the condition will <green>execute<gray>.
      - ''
      - '<white>In hand:'
      - '<yellow> Right-click on a condition sign:'
      - <gray>  Toggle NOT on or off
    debug-torch:
      name: <red>Debug Marker <green>[Right-click]
      lore:
      - <gray>Marks events and executors
      - <gray>so that they can send
      - <gray>debug messages.
      - ''
      - <gray>Debug messages will be visible
      - '<gray>only in debug mode:'
      - <green>/env debug on
      - ''
      - '<white>In hand:'
      - '<yellow> Click on an event sign:'
      - <gray>  Set or unset debug
    variable:
      saved: <green>Saved
      global: <yellow>Global
      local: <red>Local
    broken:
      name: '<red>Broken Item '
      lore:
      - <gray>This item is failed to create,
      - <gray>maybe its data is from newer or older
      - <gray>versions of Minecraft.
    placeholders:
