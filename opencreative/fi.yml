only-in-dev-world: <red>This can only be used in the world for developers (/dev).
only-in-lobby: <red>This can only be used in the lobby (/spawn).
not-for-lobby: <red>Create your own world to do it!
no-money: <red>It seems you don't have enough coins! You need at least %money% coins!
no-planet-found: <red>This world does not exist.
private-planet: This world is currently <gold>private<white>, only the owner can enter.
blacklisted-in-planet: You cannot visit this world because you are <gold>blacklisted<white>
  in it.
no-player-found: <red>This player was not found.
same-player: <red>You cannot specify yourself.
same-world: <red>You are already playing in this world.
player-error: '<white>A player error occurred. Please report this to the developer:
  <gold>%error%'
planet-error: '<white>An error occurred in the world: <gold>%error%'
chat-no-near-players: |-
  <red> Seems like there's no players in world.. Maybe you can try to use global chat?
   <red>Add ! in the begin of message, or use /cc command.
coding-error:
  message: "\n <red> <strikethrough>                   <red><reset>  ERROR <strikethrough>\
    \                   <reset>\n<white>\n <white>Oops, it seems there was a problem\
    \ executing <white>%event% <gray>-> <white>%action% <gray>(%x%,%y%,%z%)\n \n<white>\
    \ Information: <gold>%error%\n \n <red> <strikethrough>                      \
    \                              <reset>\n<white>"
  message-event-critical: "\n <dark_red> <strikethrough>          <dark_red><reset>\
    \ CRITICAL ERROR <strikethrough>          <reset>\n<white>\n <red>ATTENTION! <white>The\
    \ world has been put into build mode because a serious issue occurred during the\
    \ execution of the code <white>%event% <gray>(%x%,%y%,%z%)...\n \n<white> Information:\
    \ <gold>%error%\n \n <dark_red> <strikethrough>                              \
    \                      <reset>\n<white>"
  message-event: |-
    <gold> Error <dark_gray>| <white>An error occurred during the execution of the code <white>%event% <gray>(%x%,%y%,%z%).
     <white>Error information: <gold>%error%
  message-compile: "\n <red> <strikethrough>                   <red><reset>  ERROR\
    \ <strikethrough>                   <reset>\n<white>\n <white>A problem occurred\
    \ while saving the block <gray>(%x%,%y%,%z%)\n \n<white> Information: <gold>%error%\n\
    \ \n <red> <strikethrough>                                                   \
    \ <reset>\n<white>"
  unsupportedentityexception: Entity must be %type%, not %old%.
  unknownfunctionexception: Failed to launch function %name%, because it doesn't exist
    in code.
  unknownmethodexception: Failed to launch method %name%, because it doesn't exist
    in code.
  unknowncycleexception: Failed to start or end cycle %name%, because it doesn't exist
    in code.
  numberformatexception: A number was expected, but the item did not contain one.
    Check the items in the chest for this action.
  toolongtextexception: 'Too long text was tried to write to variable. Please substring
    it with variable action Substring text. '
  collectionwithcollectionexception: Tried to store a list as element of list. Use
    Merge Lists action instead.
  toomanyrepeatsexception: Too many repeats at once! Please add control action Wait
    to the end of repeat before closing piston.
  nottrustedlinkexception: Site %link% is not trusted by server. Please contact server
    admins.
  illegalargumentexception: An incorrect value was found in the chest. You might have
    specified a negative number, or a variable returned an incorrect value, or something
    couldn't be retrieved from the value. Check the chest's contents!
  nullpointerexception: Some value is null, such as a variable or event value. Perhaps
    you didn't set a variable, or the event value is not supported by this event.
  bad-piston: An extra piston was detected, which needs to be removed. If it’s not
    extra, select the condition type.
  indexoutofboundsexception: Values were expected in the chest, but they are either
    missing or insufficient. Check the items in the chest for this action!
  operations-limit: The code line was called multiple times in a row and reached the
    limit of %limit% calls. It seems there's a line that calls itself repeatedly.
    Find it and fix it. This line's execution has been stopped.
  errors-limit: Coding encountered too many errors in short time, please fix them.
  actions-limit: Coding encountered too many actions in short time, please reduce
    them.
  targets-changes-limit: Too many entities (%limit%) was added or removed in targets
    list with Select Target action. Reduce amount of selection or remove the mobs.
  unknown: 'Oops... It seems this is an unknown error, details: '
  unknown-block-detected: |-
    <white>
    <gold> Error <dark_gray>| <white>While saving coding blocks, some were found that were removed in updates. Click their sign and remove unnecessary chest contents (SHIFT+Right-click).
  unknown-block-coords: ' Block %category% <dark_gray>-<gray> %type%: <gray>(%x%,
    %y%, %z%)'
  unknown-layout: <red>This block opened a menu without hints, as there is a problem
    loading them...
  hover-message: <white>Click to teleport to the block.
  temp-var-not-exists: The temporary value %variable% for this event was not found
    because the event is not compatible with this value. Replace the event with a
    more suitable one.
  toomanyopenedmenusexception: Opened too many menus for %player%. Please add cooldown
    between opening menus.
coding-debug:
  condition:
    returned-true: <white>Condition %type%<white> executed, <green>True<white>.
    returned-false: <white>Condition %type%<white> did not execute, <red>False<white>.
    opposed:
      'true': <green>Yes
      'false': <red>No
  hover:
    argument: '<gray>%name%: %type%<gray> = <gold>%value%'
    executor: "<gray>Category: %category%\n<gray>Executor: %type%\n \n<gray>Actions\
      \ to execute: <yellow>%actions%"
    action: "<gray>Category: %category%\n<gray>Action: %type%\n \n<gray>Arguments:\n\
      %arguments%"
    condition: "<gray>Category: %category%\n<gray>Condition: %type%\n<gray>Opposed:\
      \ %opposed%\n \n<gray>Arguments:\n%arguments%"
  variable:
    set: '<white>New value for %variable%<white>: <gray>%value%'
    created: '<white>Variable %variable%<white> created: <gray>%value%'
  log: <dark_gray> [<gold>⌘<dark_gray>] <white>%log%
  event-message: <gray> Event Call <dark_gray>| <gray>Event %type%<white> occurred,
    finding the trigger...
  variable-found: <gray>           %name% <green>=<gray> %value%
  variable-not-found: '<gray>           %name% <red>default<gray>: %value%'
  executor-message: <gray> <gray>%type%<gray> <dark_gray>(%x% %y% %z%)
  action-message: <gray> | %type%<gray> <dark_gray>(%x% %y% %z%)
  action-hover: '<gray>Type %type% <gray>Argument <gold>%name%<gray> Value: <gold>%value%'
  parsing-code: <white>Checking code blocks, please wait...
  parsed-code: <white>All code blocks were checked in <gold>%time% seconds<white>.
  saving-code: <white><underlined>Saving the code<white><reset>...
  saved-code: '<white>The code was saved in <gold>%time% seconds<white> '
  loading-code: <white>Loading the code, please wait...
  loaded-code: '<white>The code was <underlined>loaded<white><reset> in <gold>%time%
    seconds<white> '
coding-warning:
  message: "<white>\n <dark_gray> [<gold>⚠<dark_gray>] <white>%warning% \n<white>"
  variables-limit:
    text: <gray>Maximum number of variables reached <gold>%count%<gray>/%limit%. <dark_aqua>[?]
    hover: <white>To view the list of variables, use <gold>/env var list<white>. To
      delete <white>all variables<white>, use <red>/env var clear<white>.
  changing-elements-limit:
    text: <gray>Too many list element changes <gold>%count%<gray>/%limit% in a short
      time. <dark_aqua>[?]
    hover: <white>You need to reduce the number of modified data items.
  changing-blocks-limit:
    text: <gray>Too many blocks modified <gold>%count%<gray>/%limit% in a short time.
      <dark_aqua>[?]
    hover: <white>Most likely, too many blocks were selected. Reduce the distance
      between locations or split block operations over several seconds.
  opening-inventories-limit:
    text: <gray>Inventories are being opened too frequently <gold>%count%<gray>/%limit%
      in a short time. <dark_aqua>[?]
    hover: |-
      <white>Reduce the number of menu openings or add a delay, then check whether the player is on cooldown before opening the inventory.
      <gray>This is necessary to allow the player to exit the game properly.
  bossbars-limit:
    text: <gray>Maximum number of bossbars reached <gold>%count%<gray>/%limit%. <dark_aqua>[?]
    hover: <white>If there are personal bossbars for players in the world, they should
      be removed when a player leaves the world.
  scoreboards-limit:
    text: <gray>Maximum number of scoreboards reached <gold>%count%<gray>/%limit%
      <dark_aqua>[?]
    hover: <white>If there are personal scoreboards for players in the world, they
      should be removed when a player leaves the world.
  recipes-limit:
    text: <gray>Maximum number of item recipes reached <gold>%count%<gray>/%limit%
      <dark_aqua>[?]
    hover: <white>You need to reduce the number of created recipes or remove unnecessary
      ones.
